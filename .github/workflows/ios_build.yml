# 蘋果手機版編譯檢查（第一階段）
# 目的：確認在 Windows 做的遊戲，在蘋果電腦上匯出、編譯得過。
# 這一階段不簽署、不上傳到蘋果，所以不需要任何金鑰，也還不能裝到手機。
# 本版本庫是公開的：金鑰、團隊編號之後一律放 GitHub 的「祕密設定」，不寫在這個檔案裡。
name: 蘋果手機版編譯檢查

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios_build.yml"
      - "export_presets.cfg"
      - "project.godot"

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATE_DIR: 4.7.2.stable

jobs:
  build:
    name: 匯出並編譯（不簽署）
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: 取得程式
        uses: actions/checkout@v4

      - name: 選用最新的 Xcode 26（Godot 4.7 的範本需要新版開發套件才連結得過）
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '
' ' ')"

      - name: 下載 Godot 與匯出範本
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fL --retry 3 -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          curl -fL --retry 3 -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpl"
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$DEST"
          mv "$RUNNER_TEMP/tpl/templates/"* "$DEST/"
          ls "$DEST" | grep -i ios
          echo "GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          rm godot.zip templates.tpz

      - name: 填入編譯檢查用的假團隊編號
        run: |
          # 只為了讓匯出通過檢查；這一階段不簽署，真的團隊編號之後從祕密設定帶入
          sed -i '' 's|^application/app_store_team_id=""|application/app_store_team_id="ABCDE12345"|' export_presets.cfg
          grep -n "app_store_team_id" export_presets.cfg

      - name: 匯入素材
        run: |
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import

      - name: 匯出 Xcode 專案
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/PetLineup.ipa
          ls -la build/ios
          test -d build/ios/PetLineup.xcodeproj

      - name: 檢查匯出內容（圖示、名稱、設定）
        run: |
          cd build/ios
          {
            echo "── 檔案"; ls
            echo "── 圖示"; find . -path "*AppIcon.appiconset*" -type f | head -30
            echo "── 各語言名稱"; ls -d PetLineup/*.lproj; cat PetLineup/en.lproj/InfoPlist.strings
            echo "── 設定檔"; grep -A1 -E "CFBundleDisplayName|CFBundleIdentifier|UISupportedInterfaceOrientations|ITSApp|UIDeviceFamily|Usage" PetLineup/*Info.plist | head -40
            echo "── 專案內容"; xcodebuild -list -project PetLineup.xcodeproj 2>&1
          } > inspect.log 2>&1 || true
          cat inspect.log
          # 紀錄檔要登入才看得到，所以把重點寫成公開的註記
          echo "::notice title=匯出內容::$(head -c 3500 inspect.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: 編譯（不簽署）
        run: |
          cd build/ios
          SCHEME=$(xcodebuild -list -project PetLineup.xcodeproj 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1;exit}')
          echo "scheme=$SCHEME"
          set +e
          xcodebuild             -project PetLineup.xcodeproj             -scheme "${SCHEME:-PetLineup}"             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build > xcodebuild.log 2>&1
          CODE=$?
          tail -n 80 xcodebuild.log
          if [ $CODE -ne 0 ]; then
            ERR=$( (grep -E "error:|errors? generated|BUILD FAILED|xcodebuild: error" xcodebuild.log | sort -u | head -n 25; echo "── 最後幾行"; tail -n 15 xcodebuild.log) | head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=編譯失敗（scheme=$SCHEME）::$ERR"
            exit $CODE
          fi
          echo "::notice title=編譯成功::$(grep -E 'BUILD SUCCEEDED' xcodebuild.log | head -1)"
